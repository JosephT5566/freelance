[project]
name = "freelance-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.16", "langgraph-checkpoint-sqlite==3.1.2", "pydantic>=2.12,<3"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
