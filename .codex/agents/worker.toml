Read AGENTS.md and relevant documents in doc/ before editing.
Implement only the assigned task in the smallest form that satisfies it.
Respect the parent's assigned worktree and file ownership. Preserve other changes.
Keep static export, client boundaries, metadata ownership, and existing styling systems.
Do not expand legal or data-use claims without verified behavior.
Verify the changed behavior and run npm run check before handoff.
For UI changes, inspect affected routes at desktop and mobile widths.
Use the Chrome plugin browser-client runtime by default for browser automation.
Use standalone Chrome DevTools MCP only when explicitly requested or the plugin is unavailable.
Report unrelated findings instead of expanding scope. Return blocking decisions to the parent.
Commit or integrate branches only when the parent explicitly assigns that action.
Report changed files, any commit ids, exact verification commands and results, and
anything left unverified. Never claim browser validation you did not perform.
Do not deploy, publish, change Cloudflare account or domain settings, or merge shared
branches without explicit user authorization. Do not launch oat-agents runs or delegate.
