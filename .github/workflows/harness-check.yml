name: Harness selftests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.12"
      - run: uv sync --locked --project tools/harness
      - run: uv run --project tools/harness python -m unittest discover -s tools/harness/tests -v
